
[tool.ruff]
lint.select = ["ASYNC", "ARG", "B", "C", "C4", "E", "F", "Q", "W", "I"]

lint.ignore = ["F401"]

lint.unfixable = ["F401"]

line-length = 120

target-version = "py39"

[project]
name = "hydrogen-ai"
version = "0.2.0"
description = ""
authors = [
    {name = "phillychi3",email = "phillychi3@gmail.com"}
]
license = {text = "MIT License"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx (>=0.28.1,<0.29.0)",
    "ftfy (>=6.3.1,<7.0.0)",
    "aiofiles (>=25.1.0,<26.0.0)",
    "pydantic (>=2.12.5,<3.0.0)"
]


[tool.poetry]
packages = [{include = "hai"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
