[project]
name = "hydrogen-ai-qdrant"
version = "0.1.0"
description = "Qdrant vector store for hydrogen-ai"
authors = [
    {name = "phillychi3",email = "phillychi3@gmail.com"}
]
license = {text = "MIT License"}
readme = "readme.md"
requires-python = ">=3.9"
dependencies = [
    "hydrogen-ai (>=0.2.0,<0.3.0)",
    "qdrant-client (>=1.15.1,<2.0.0)"
]


[tool.poetry]
packages = [{include = "hai/vectorstores/qdrant", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
